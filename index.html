<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Audio Scheduler</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    .navbar {
      display: flex;
      background: #1f2937;
      padding: 1rem;
      gap: 1rem;
    }

    .nav-btn {
      background: #2563eb;
      border: none;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    .nav-btn:hover {
      background: #1d4ed8;
    }

    .page {
      display: none;
      padding: 2rem;
    }

    .active {
      display: block;
    }

    .clock {
      font-size: 4rem;
      color: #60a5fa;
      margin-bottom: 1rem;
    }

    .status {
      margin-top: 1rem;
      color: #9ca3af;
      min-height: 24px;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 2rem;
    }

    .audio-btn {
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 1rem;
    }

    .audio-btn:hover {
      background: #1d4ed8;
    }

    .config-card {
      background: #1f2937;
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
    }

    .save-btn {
      margin-top: 1rem;
      background: #16a34a;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }

    .save-btn:hover {
      background: #15803d;
    }

    .schedule-list {
      margin-top: 2rem;
    }

    .schedule-item {
      background: #374151;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 10px;
    }

  </style>
</head>
<body>

  <!-- NAVIGATION -->
  <div class="navbar">
    <button class="nav-btn" onclick="showPage('homePage')">
      Home
    </button>

    <button class="nav-btn" onclick="showPage('configPage'), renderSchedules()">
      Config
    </button>
  </div>

  <!-- HOME PAGE -->
  <div id="homePage" class="page active">

    <h1>Audio Scheduler</h1>

    <div class="clock" id="clock">
      00:00:00
    </div>

    <div class="status" id="status">
      Waiting for scheduled playback...
    </div>

    <h2>Manual Audio Triggers</h2>

    <div class="button-grid" id="buttonGrid"></div>
    <button
  class="audio-btn"
  onclick="stopAudio()"
  style="
    background:#dc2626;
    margin-top:20px;
    width:100%;
  "
>
  STOP AUDIO
</button>
  </div>

  <!-- CONFIG PAGE -->
  <div id="configPage" class="page"><h1>Schedule Configuration</h1>

<h3>
  (AdHoc Audio, Will Only Last Until Page Refresh.
  Contact Max to add permanent Audio)
</h3>

<div class="config-card">

  <label for="scheduleTime">Time</label>
  <input type="time" id="scheduleTime">

  <label for="audioSelect">Select Audio</label>
  <select id="audioSelect"></select>

  <label>Days</label>

  <div class="day-selector">

    <label>
      <input type="checkbox" value="Monday" class="day-checkbox">
      Mon
    </label>

    <label>
      <input type="checkbox" value="Tuesday" class="day-checkbox">
      Tue
    </label>

    <label>
      <input type="checkbox" value="Wednesday" class="day-checkbox">
      Wed
    </label>

    <label>
      <input type="checkbox" value="Thursday" class="day-checkbox">
      Thu
    </label>

    <label>
      <input type="checkbox" value="Friday" class="day-checkbox">
      Fri
    </label>

    <label>
      <input type="checkbox" value="Saturday" class="day-checkbox">
      Sat
    </label>

    <label>
      <input type="checkbox" value="Sunday" class="day-checkbox">
      Sun
    </label>

  </div>

  <button class="save-btn" onclick="saveSchedule()">
    Save Schedule
  </button>

</div>

<div class="schedule-list" id="scheduleList"></div>

  </div>

  <script>

    // ==================================================
    // AUDIO FILES
    // ==================================================

    const audioFiles = [
  {
    name: "Bell 1",
    url: "sounds/bell1.mp3"
  },
  {
    name: "Bell 2",
    url: "sounds/bell2.mp3"
  },
  {
    name: "Bell 3",
    url: "sounds/bell3.mp3"
  },
  {
    name: "Bell 4",
    url: "sounds/bell4.mp3"
  },
  {
    name: "Bell 5",
    url: "sounds/bell5.mp3"
  },
  {
    name: "Bell 6",
    url: "sounds/bell6.mp3"
  },
  {
    name: "Bell 7",
    url: "sounds/bell7.mp3"
  },
  {
    name: "Bell 8",
    url: "sounds/bell8.mp3"
  },
  {
    name: "Bell 9",
    url: "sounds/bell9.mp3"
  },
  {
    name: "Bell 10",
    url: "sounds/bell10.mp3"
  },
  {
    name: "Bell 11",
    url: "sounds/bell11.mp3"
  },
  {
    name: "Bell 12",
    url: "sounds/bell12.mp3"
  }
];

    // ==================================================
    // STATE
    // ==================================================

    let schedules = [];

    // ==================================================
    // PAGE NAVIGATION
    // ==================================================

    function showPage(pageId) {

      document.querySelectorAll(".page").forEach(page => {
        page.classList.remove("active");
      });

      document.getElementById(pageId).classList.add("active");
    }

    // ==================================================
    // CLOCK
    // ==================================================

    const clockEl = document.getElementById("clock");
    const statusEl = document.getElementById("status");

    function updateClock() {

      const now = new Date();

      const hours = String(now.getHours()).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");
      const seconds = String(now.getSeconds()).padStart(2, "0");

      const currentTime = `${hours}:${minutes}`;
      const displayTime = `${hours}:${minutes}:${seconds}`;

      clockEl.textContent = displayTime;

      checkSchedules(currentTime);
    }

    setInterval(checkSchedules, 1000);

    updateClock();

    // ==================================================
    // MANUAL BUTTONS
    // ==================================================

    const buttonGrid = document.getElementById("buttonGrid");

    audioFiles.forEach(audioData => {

      const button = document.createElement("button");

      button.className = "audio-btn";

      button.textContent = audioData.name;

      button.addEventListener("click", () => {
        playAudio(audioData.url, audioData.name);
      });

      buttonGrid.appendChild(button);
    });

    // ==================================================
    // AUDIO SELECT
    // ==================================================

    const audioSelect = document.getElementById("audioSelect");

    audioFiles.forEach((audio, index) => {

      const option = document.createElement("option");

      option.value = index;

      option.textContent = audio.name;

      audioSelect.appendChild(option);
    });


  // ==================================================
  // GLOBAL AUDIO STATE
  // ==================================================

  let currentAudio = null;
  let currentAudioLabel = null;

  // ==================================================
  // STOP AUDIO FUNCTION
  // ==================================================

  function stopAudio() {

    if (currentAudio) {

      currentAudio.pause();

      currentAudio.currentTime = 0;

      currentAudio = null;

      currentAudioLabel = null;

      statusEl.textContent = "Audio stopped";
    }
  }

  // ==================================================
  // PLAY AUDIO
  // ==================================================

  async function playAudio(url, label) {

    try {

      // ------------------------------------------
      // PREVENT DUPLICATE SAME AUDIO
      // ------------------------------------------

      if (
        currentAudio &&
        currentAudioLabel === label &&
        !currentAudio.paused
      ) {
        return;
      }

      // ------------------------------------------
      // STOP CURRENT AUDIO
      // ------------------------------------------
      
      stopAudio();
      
      // ------------------------------------------
      // CREATE NEW AUDIO
      // ------------------------------------------

      currentAudio = new Audio(url);

      currentAudioLabel = label;

      currentAudio.preload = "auto";

      // ------------------------------------------
      // PLAY
      // ------------------------------------------

      await currentAudio.play();

      statusEl.textContent = `Playing: ${label}`;

      // ------------------------------------------
      // CLEANUP WHEN FINISHED
      // ------------------------------------------

      currentAudio.onended = () => {

        currentAudio = null;

        currentAudioLabel = null;

        statusEl.textContent =
          "Playback finished";
      };

    } catch (err) {

      console.error(err);

      statusEl.textContent =
        `Failed to play: ${label}`;

      currentAudio = null;

      currentAudioLabel = null;
    }
  }

    // ==================================================
    // SAVE SCHEDULE
    // ==================================================

    let schedules = JSON.parse(localStorage.getItem("schedules")) || [];

function saveSchedule() {
  const time = document.getElementById("scheduleTime").value;
  const audio = document.getElementById("audioSelect").value;

  const days = Array.from(
    document.querySelectorAll(".day-checkbox:checked")
  ).map(checkbox => checkbox.value);

  if (!time) {
    alert("Please select a time.");
    return;
  }

  if (!audio) {
    alert("Please select an audio file.");
    return;
  }

  if (days.length === 0) {
    alert("Please select at least one day.");
    return;
  }

  const schedule = {
    id: Date.now(),
    time: time,
    audio: audio,
    days: days
  };

  schedules.push(schedule);

  localStorage.setItem("schedules", JSON.stringify(schedules));

  // Clear form
  document.getElementById("scheduleTime").value = "";
  document.getElementById("audioSelect").selectedIndex = 0;

  document.querySelectorAll(".day-checkbox").forEach(cb => {
    cb.checked = false;
  });

  renderSchedules();
}
    // ==================================================
    // RENDER SCHEDULES
    // ==================================================

    function renderSchedules() {
  const list = document.getElementById("scheduleList");

  list.innerHTML = "";

  if (schedules.length === 0) {
    list.innerHTML = "<p>No schedules configured.</p>";
    return;
  }

  schedules.forEach(schedule => {
    const item = document.createElement("div");

    item.className = "schedule-item";

    item.innerHTML = `
      <div>
        <strong>${schedule.time}</strong>
        <div>${schedule.audio}</div>
        <small>${schedule.days.join(", ")}</small>
      </div>

      <button onclick="deleteSchedule(${schedule.id})">
        Delete
      </button>
    `;

    list.appendChild(item);
  });
}

    function deleteSchedule(id) {
  schedules = schedules.filter(schedule => schedule.id !== id);

  localStorage.setItem("schedules", JSON.stringify(schedules));

  renderSchedules();
}
    // ==================================================
    // CHECK SCHEDULES
    // ==================================================

    function checkSchedules() {
  const now = new Date();

  const currentTime =
    String(now.getHours()).padStart(2, "0") +
    ":" +
    String(now.getMinutes()).padStart(2, "0");

  const currentDay = now.toLocaleDateString("en-US", {
    weekday: "long"
  });

  schedules.forEach(schedule => {

    if (
      schedule.time === currentTime &&
      schedule.days.includes(currentDay)
    ) {
      playAudio(schedule.audio);
    }

  });
}
  </script>

</body>
</html>
