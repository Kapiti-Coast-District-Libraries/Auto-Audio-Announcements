<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Audio Scheduler</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    .navbar {
      display: flex;
      background: #1f2937;
      padding: 1rem;
      gap: 1rem;
    }

    .nav-btn {
      background: #2563eb;
      border: none;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    .nav-btn:hover {
      background: #1d4ed8;
    }

    .page {
      display: none;
      padding: 2rem;
    }

    .active {
      display: block;
    }
/* ==================================================
   CLICK TO CONTINUE OVERLAY
   ================================================== */

#clickOverlay {
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: rgba(0, 0, 0, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
}

#clickContinueButton {
  width: min(80vw, 600px);
  height: min(40vh, 300px);
  background: #dc2626;
  color: white;
  border: none;
  border-radius: 20px;
  font-size: clamp(2rem, 5vw, 4rem);
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 40px rgba(220, 38, 38, 0.6);
}

#clickContinueButton:hover {
  background: #b91c1c;
}

#clickContinueButton:active {
  background: #991b1b;
}
    /* ==================================================
       LAYOUT & HOME PAGE SPECIFIC
       ================================================== */
    
    .main-content-wrapper {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
    }

    .left-column {
      flex: 0 0 65%; /* Take 65% width */
    }

    .right-column {
      flex: 0 0 calc(35% - 2rem); /* Take remaining 35% minus gap */
      background: #1f2937;
      padding: 1.5rem;
      border-radius: 12px;
      box-sizing: border-box;
    }

    h2.column-header {
      margin-top: 0;
      border-bottom: 2px solid #374151;
      padding-bottom: 0.5rem;
      color: #e5e7eb;
    }

    .clock {
      font-size: 4rem;
      color: #60a5fa;
      margin-bottom: 0.5rem;
    }

    .day-display {
      font-size: 1.5rem;
      color: #9ca3af;
      margin-bottom: 1rem;
      font-weight: bold;
    }

    .status {
      margin-top: 1rem;
      color: #a78bfa; /* Slightly purpler to stand out as status */
      min-height: 24px;
      font-weight: bold;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 1rem;
    }

    /* ==================================================
       SHARED COMPONENTS (Buttons, Cards, Items)
       ================================================== */

    .audio-btn {
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 1rem;
    }

    .audio-btn:hover {
      background: #1d4ed8;
    }

    .config-card {
      background: #1f2937;
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      box-sizing: border-box;
    }

    input[type="time"] {
      cursor: pointer;
    }

    .days-picker {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .day-checkbox {
      display: none;
    }

    .day-label {
      background: #374151;
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .day-checkbox:checked + .day-label {
      background: #2563eb;
      font-weight: bold;
    }

    .save-btn {
      margin-top: 1.5rem;
      background: #16a34a;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-size: 1rem;
      width: 100%;
    }

    .save-btn:hover {
      background: #15803d;
    }

    .schedule-list {
      margin-top: 1rem;
    }

    .schedule-item {
      background: #374151;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid transparent;
    }

    /* Highlight next upcoming schedule vaguely */
    .schedule-item.upcoming {
      border-left-color: #60a5fa;
    }

    .badge-container {
      display: flex;
      gap: 4px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .badge {
      background: #1f2937;
      color: #60a5fa;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
    }

    /* Helper for empty lists */
    .no-schedules {
      color: #9ca3af;
      font-style: italic;
      text-align: center;
      margin-top: 2rem;
    }

  </style>
</head>
<script src="schedules.js"></script>
<body>
<!-- CLICK TO CONTINUE OVERLAY -->
<div id="clickOverlay">
  <button id="clickContinueButton">
    Click anywhere to continue
  </button>
</div>

<script>
  const clickOverlay = document.getElementById("clickOverlay");

  clickOverlay.addEventListener("click", () => {
    clickOverlay.remove();
  });
</script>
  <!-- NAVIGATION -->
  <div class="navbar">
    <button class="nav-btn" onclick="showPage('homePage')">
      Home
    </button>

    <button class="nav-btn" onclick="showPage('configPage'); renderConfigSchedules()">
      Config
    </button>
  </div>

  <!-- HOME PAGE -->
  <div id="homePage" class="page active">
    
    <div class="main-content-wrapper">
      
      <!-- LEFT COLUMN: Clock & Buttons (65%) -->
      <div class="left-column">
        <h1>Audio Scheduler</h1>

        <div class="clock" id="clock">00:00:00</div>
        <div class="day-display" id="dayDisplay">...</div>

        <div class="status" id="status">
          Waiting for scheduled playback...
        </div>

        <h2 style="margin-top: 2rem;">Manual Audio Triggers</h2>
        <div class="button-grid" id="buttonGrid"></div>
        
        <button
          class="audio-btn"
          onclick="stopAudio()"
          style="
            background:#dc2626;
            margin-top:20px;
            width:100%;
            font-weight: bold;
          "
        >
          STOP AUDIO
        </button>
      </div>

      <!-- RIGHT COLUMN: Today's Schedule (35%) -->
      <div class="right-column">
        <h2 class="column-header">Today's Schedule</h2>
        <div class="schedule-list" id="homeScheduleList">
          <!-- Populated by JS -->
        </div>
      </div>

    </div><!-- end main-content-wrapper -->

  </div>

  <!-- CONFIG PAGE -->
  <div id="configPage" class="page">

    <h1>Schedule Configuration</h1><br>
    <h3>(AdHoc Audio, Will Only Last Until Page Refresh.)</h3>

    <div class="config-card">

      <label for="scheduleTime">Time</label>
      <input type="time" id="scheduleTime" onclick="this.showPicker()" />

      <label>Days of the Week</label>
      <div class="days-picker" id="daysPicker">
        <input type="checkbox" id="day-Sun" value="Sun" class="day-checkbox">
        <label for="day-Sun" class="day-label">Sun</label>

        <input type="checkbox" id="day-Mon" value="Mon" class="day-checkbox">
        <label for="day-Mon" class="day-label">Mon</label>

        <input type="checkbox" id="day-Tue" value="Tue" class="day-checkbox">
        <label for="day-Tue" class="day-label">Tue</label>

        <input type="checkbox" id="day-Wed" value="Wed" class="day-checkbox">
        <label for="day-Wed" class="day-label">Wed</label>

        <input type="checkbox" id="day-Thu" value="Thu" class="day-checkbox">
        <label for="day-Thu" class="day-label">Thu</label>

        <input type="checkbox" id="day-Fri" value="Fri" class="day-checkbox">
        <label for="day-Fri" class="day-label">Fri</label>

        <input type="checkbox" id="day-Sat" value="Sat" class="day-checkbox">
        <label for="day-Sat" class="day-label">Sat</label>
      </div>

      <label>Select Audio</label>
      <select id="audioSelect"></select>

      <button class="save-btn" onclick="saveSchedule()">
        Save Schedule
      </button>

    </div>

    <h2>Master Schedule List (All Days)</h2>
    <div class="schedule-list" id="configScheduleList"></div>

  </div>

  <script>

    // ==================================================
    // AUDIO FILES & CONSTANTS
    // ==================================================

    const audioFiles = [
      { name: "Deborah: Closing in 25", url: "sounds/Deborah 25Min.mp3" },
      { name: "Deborah: Closing in 10", url: "sounds/Deborah 10Min.mp3" },
      { name: "Deborah: Library Closed", url: "sounds/Deborah Closed.mp3" },
      { name: "Natala: Closing in 25", url: "sounds/Natala 25Mins.mp3" },
      { name: "Natala: Closing in 10", url: "sounds/Natala 10Mins.mp3" },
      { name: "Natala: Library Closed", url: "sounds/Natala Closed.mp3" },
      { name: "EA Natala: Closing in 30", url: "sounds/EA Natala 30Mins.mp3" },
      { name: "EA Natala: Closing in 15", url: "sounds/EA Natala 15Mins.mp3" },
      { name: "EA Natala: Closing in 5", url: "sounds/EA Natala 5Mins.mp3" },
    ];

    const DAYS_SHORT = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

    // ==================================================
    // PAGE NAVIGATION
    // ==================================================

    function showPage(pageId) {
      document.querySelectorAll(".page").forEach(page => {
        page.classList.remove("active");
      });
      document.getElementById(pageId).classList.add("active");
    }

    // ==================================================
    // CLOCK & MAIN LOOP
    // ==================================================

    const clockEl = document.getElementById("clock");
    const dayDisplayEl = document.getElementById("dayDisplay");
    const statusEl = document.getElementById("status");

    function updateClock() {
      const now = new Date();

      const hours = String(now.getHours()).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");
      const seconds = String(now.getSeconds()).padStart(2, "0");

      const currentTimeString = `${hours}:${minutes}`; // "HH:MM"
      const displayTimeString = `${hours}:${minutes}:${seconds}`;
      const currentDayShort = DAYS_SHORT[now.getDay()]; // "Mon"

      // 1. Update Display
      clockEl.textContent = displayTimeString;
      dayDisplayEl.textContent = now.toLocaleDateString('en-US', { weekday: 'long' });

      // 2. Core Logic: Check if something needs to play
      checkSchedules(currentTimeString, currentDayShort);

      // 3. Display Logic: Update the Home Page schedule list (so it stays current if day changes)
      renderHomePageSchedule(currentDayShort, currentTimeString);
    }

    // Start the loop
    setInterval(updateClock, 1000);
    updateClock(); // Run immediately

    // ==================================================
    // MANUAL UI POPULATION
    // ==================================================

    // 1. Manual Buttons
    const buttonGrid = document.getElementById("buttonGrid");
    audioFiles.forEach(audioData => {
      const button = document.createElement("button");
      button.className = "audio-btn";
      button.textContent = audioData.name;
      button.addEventListener("click", () => {
        playAudio(audioData.url, audioData.name);
      });
      buttonGrid.appendChild(button);
    });

    // 2. Config Audio Select
    const audioSelect = document.getElementById("audioSelect");
    audioFiles.forEach((audio, index) => {
      const option = document.createElement("option");
      option.value = index;
      option.textContent = audio.name;
      audioSelect.appendChild(option);
    });

    // ==================================================
    // AUDIO PLAYBACK ENGINE
    // ==================================================

    let currentAudio = null;
    let currentAudioLabel = null;

    function stopAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
        currentAudioLabel = null;
        statusEl.textContent = "Audio stopped manually.";
      }
    }

    async function playAudio(url, label) {
      try {
        // Prevent interrupting the same file if it's already playing
        if (currentAudio && currentAudioLabel === label && !currentAudio.paused) {
          return;
        }

        stopAudio(); // Stop whatever is currently playing

        currentAudio = new Audio(url);
        currentAudioLabel = label;
        currentAudio.preload = "auto";

        await currentAudio.play();
        statusEl.textContent = `Playing: ${label}`;

        currentAudio.onended = () => {
          currentAudio = null;
          currentAudioLabel = null;
          statusEl.textContent = "Playback finished.";
        };
      } catch (err) {
        console.error("Audio playback error:", err);
        statusEl.textContent = `Error playing: ${label}`;
        currentAudio = null;
        currentAudioLabel = null;
      }
    }

// ==================================================
// SCHEDULE CORE LOGIC
// ==================================================

function checkSchedules(currentTime, currentDay) {
  const now = new Date();

  schedules.forEach(schedule => {

    // Only consider schedules that run today
    if (!schedule.days.includes(currentDay)) {
      return;
    }

    // Build the scheduled time for today
    const scheduledTime = new Date(now);
    const [hours, minutes] = schedule.time.split(":").map(Number);

    scheduledTime.setHours(hours, minutes, 0, 0);

    // Unique ID for this specific occurrence
    // Example: "2026-08-27_10:00"
    const occurrenceId =
      `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}_${schedule.time}`;

    // Already played this occurrence
    if (schedule.lastPlayedOccurrence === occurrenceId) {
      return;
    }

    // If the scheduled time has arrived, play it.
    //
    // This is the important change:
    // We no longer require currentTime === schedule.time.
    //
    // If Chrome delays the background tab and this function runs
    // at 10:00:20 instead of 10:00:00, the schedule will still play.
    if (now >= scheduledTime) {

      playAudio(schedule.audio.url, schedule.audio.name);

      // Remember that this occurrence has already played
      schedule.lastPlayedOccurrence = occurrenceId;
    }
  });
}    // ==================================================
    // CONFIGURATION PAGE ACTIONS & RENDERING
    // ==================================================

    function saveSchedule() {
      const timeInput = document.getElementById("scheduleTime");
      const time = timeInput.value;
      const audioIndex = document.getElementById("audioSelect").value;
      const daysPicker = document.getElementById("daysPicker");

      const selectedDays = Array.from(daysPicker.querySelectorAll(".day-checkbox:checked"))
        .map(cb => cb.value);

      if (!time) {
        alert("Please select a time.");
        return;
      }

      if (selectedDays.length === 0) {
        alert("Please select at least one day.");
        return;
      }

      const selectedAudio = audioFiles[audioIndex];

      schedules.push({
        time: time,
        days: selectedDays,
        audio: selectedAudio,
        played: false // internal flag
      });

      // Sort schedules by time automatically
      schedules.sort((a, b) => a.time.localeCompare(b.time));

      // Clear UI
      daysPicker.querySelectorAll(".day-checkbox").forEach(cb => cb.checked = false);
      timeInput.value = "";

      renderConfigSchedules();
    }

    // Renders EVERYTHING (Config page)
    function renderConfigSchedules() {
      const scheduleList = document.getElementById("configScheduleList");
      scheduleList.innerHTML = "";

      if (schedules.length === 0) {
        scheduleList.innerHTML = '<div class="no-schedules">No schedules set.</div>';
        return;
      }

      schedules.forEach((schedule) => {
        const div = document.createElement("div");
        div.className = "schedule-item";

        const dayBadges = schedule.days.map(d => `<span class="badge">${d}</span>`).join(" ");

        div.innerHTML = `
          <div>
            <strong>${schedule.time}</strong> — ${schedule.audio.name}
            <div class="badge-container">${dayBadges}</div>
          </div>
        `;
        scheduleList.appendChild(div);
      });
    }

    // ==================================================
    // HOME PAGE DISPLAY LOGIC
    // ==================================================

    // Renders ONLY today's schedules (Home page right column)
    function renderHomePageSchedule(currentDayShort, currentTime) {
      const homeList = document.getElementById("homeScheduleList");
      
      // Filter the master list for things happening TODAY
      const todaysSchedules = schedules.filter(s => s.days.includes(currentDayShort));

      // Quick performance optimization: don't redraw if nothing changed (vaguely)
      // This function runs every second. We only need to rebuild the HTML if the count changed,
      // or if we cross a minute boundary where an item might change visual state (e.g., 'upcoming')
      if (homeList.dataset.lastCount == todaysSchedules.length && homeList.dataset.lastTime === currentTime) {
         return; 
      }
      homeList.dataset.lastCount = todaysSchedules.length;
      homeList.dataset.lastTime = currentTime;

      homeList.innerHTML = "";

      if (todaysSchedules.length === 0) {
        homeList.innerHTML = '<div class="no-schedules">No audio scheduled for today.</div>';
        return;
      }

      todaysSchedules.forEach((schedule) => {
        const div = document.createElement("div");
        // We use a simpler style for the home page sidebar
        div.className = "schedule-item"; 
        
        // Vaguely highlight upcoming ones (after current time)
        if (schedule.time > currentTime) {
            div.classList.add('upcoming');
        }

        div.innerHTML = `
          <div>
            <strong>${schedule.time}</strong><br>
            <span style="color: #d1d5db; font-size: 0.9rem;">${schedule.audio.name}</span>
          </div>
        `;
        homeList.appendChild(div);
      });
    }

  </script>
</body>
</html>
